name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/gui/src-tauri
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install frontend dependencies
        working-directory: app/gui
        run: npm ci
      - name: Validate release metadata
        shell: pwsh
        run: |
          $config = Get-Content app/gui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = (Get-Content app/VERSION.txt -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the application version.'
          }
          $expectedEndpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          if ($config.plugins.updater.endpoints.Count -ne 1 -or $config.plugins.updater.endpoints[0] -ne $expectedEndpoint) {
            throw 'The updater endpoint does not match this repository.'
          }
          if ([string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey)) {
            throw 'The updater public key is missing.'
          }
      - name: Frontend tests
        working-directory: app/gui
        run: npm test
      - name: Python test dependencies
        run: python -m pip install numpy==2.2.6
      - name: Python tests
        run: python -m unittest discover -s app/tests -v
      - name: Rust tests
        run: cargo test --locked --manifest-path app/gui/src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/gui
          args: -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: 'SubHooper ${{ github.ref_name }}'
          releaseBody: 'Local subtitle extraction, cleanup, and translation for Windows. See CHANGELOG.md for changes in this version.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
