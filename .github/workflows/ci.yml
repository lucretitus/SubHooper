name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/gui/src-tauri
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Frontend dependencies
        working-directory: app/gui
        run: npm ci
      - name: Frontend tests
        working-directory: app/gui
        run: npm test
      - name: Frontend build
        working-directory: app/gui
        run: npm run build
      - name: Rust tests
        run: cargo test --locked --manifest-path app/gui/src-tauri/Cargo.toml
      - name: Python test dependencies
        run: python -m pip install numpy==2.2.6
      - name: Python tests
        run: python -m unittest discover -s app/tests -v

